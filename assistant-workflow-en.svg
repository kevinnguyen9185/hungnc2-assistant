  <line x1="430" y1="600" x2="415" y2="685" stroke="#A39B8B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="255" y="650" font-size="13" fill="#7A7468">log tasks · mark Done</text>
  <line x1="510" y1="600" x2="800" y2="685" stroke="#A39B8B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <line x1="742" y1="600" x2="880" y2="685" stroke="#A39B8B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="888" y="650" font-size="13" fill="#7A7468">commit + journal</text>

  <!-- ============ NOTION CARD ============ -->
  <rect x="60" y="688" width="580" height="482" rx="16" fill="#FFFFFF" stroke="#E5DFD6" stroke-width="1.5"/>
  <rect x="85" y="710" width="30" height="30" rx="6" fill="#191919"/>
  <text x="100" y="732" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">N</text>
  <text x="128" y="732" font-size="18" font-weight="bold" fill="#2B2B2B">Notion — shared task boards</text>
  <text x="128" y="753" font-size="12.5" fill="#7A7468">one place we all look at</text>

  <!-- mini calendar -->
  <rect x="85" y="768" width="530" height="192" rx="10" fill="#191919"/>
  <text x="105" y="795" font-size="14" font-weight="bold" fill="#F0F0F0">Personal Tasks</text>
  <text x="595" y="795" text-anchor="end" font-size="11.5" fill="#8F8F8F">personal task calendar · August 2026</text>
  <g font-size="10" fill="#7C7C7C">
    <text x="140" y="818" text-anchor="middle">Sun</text><text x="210" y="818" text-anchor="middle">Mon</text>
    <text x="280" y="818" text-anchor="middle">Tue</text><text x="350" y="818" text-anchor="middle">Wed</text>
    <text x="420" y="818" text-anchor="middle">Thu</text><text x="490" y="818" text-anchor="middle">Fri</text>
    <text x="560" y="818" text-anchor="middle">Sat</text>
  </g>
  <g stroke="#2E2E2E" stroke-width="1">
    <line x1="105" y1="826" x2="595" y2="826"/><line x1="105" y1="888" x2="595" y2="888"/>
    <line x1="175" y1="826" x2="175" y2="950"/><line x1="245" y1="826" x2="245" y2="950"/>
    <line x1="315" y1="826" x2="315" y2="950"/><line x1="385" y1="826" x2="385" y2="950"/>
    <line x1="455" y1="826" x2="455" y2="950"/><line x1="525" y1="826" x2="525" y2="950"/>
    <line x1="105" y1="950" x2="595" y2="950"/>
  </g>
  <g font-size="9.5" fill="#6E6E6E">
    <text x="168" y="840" text-anchor="end">26</text><text x="238" y="840" text-anchor="end">27</text>
    <text x="308" y="840" text-anchor="end">28</text><text x="378" y="840" text-anchor="end">29</text>
    <text x="448" y="840" text-anchor="end">30</text><text x="518" y="840" text-anchor="end">31</text>
    <text x="168" y="902" text-anchor="end">2</text><text x="238" y="902" text-anchor="end">3</text>
    <text x="308" y="902" text-anchor="end">4</text><text x="378" y="902" text-anchor="end">5</text>
    <text x="448" y="902" text-anchor="end">6</text><text x="518" y="902" text-anchor="end">7</text>
    <text x="588" y="902" text-anchor="end">8</text>
  </g>
  <circle cx="581" cy="838" r="9" fill="#EB5757"/>
  <text x="581" y="841.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">1</text>
  <rect x="529" y="848" width="62" height="30" rx="4" fill="#333333"/>
  <text x="534" y="860" font-size="8.5" fill="#EDEDED">Finish the</text>
  <text x="534" y="872" font-size="8.5" fill="#EDEDED">assistant ✓</text>
  <rect x="179" y="906" width="62" height="30" rx="4" fill="#333333"/>
  <text x="185" y="918" font-size="8.5" fill="#EDEDED">Research ph.1</text>
  <text x="185" y="930" font-size="8.5" fill="#EDEDED">za-xxx</text>
  <rect x="249" y="906" width="62" height="30" rx="4" fill="#333333"/>
  <text x="255" y="918" font-size="8.5" fill="#EDEDED">Research ph.1</text>
  <text x="255" y="930" font-size="8.5" fill="#EDEDED">za-yyyy</text>
  <rect x="389" y="906" width="62" height="30" rx="4" fill="#333333"/>
  <text x="395" y="918" font-size="8.5" fill="#EDEDED">Report results</text>
  <text x="395" y="930" font-size="8.5" fill="#EDEDED">to my boss</text>

  <!-- mini kanban -->
  <rect x="85" y="976" width="530" height="172" rx="10" fill="#191919"/>
  <text x="105" y="1003" font-size="14" font-weight="bold" fill="#F0F0F0">Assistant Tasks</text>
  <text x="595" y="1003" text-anchor="end" font-size="11.5" fill="#8F8F8F">the assistants’ task board</text>
  <rect x="105" y="1014" width="52" height="20" rx="4" fill="#1F3D2B"/>
  <text x="131" y="1028" text-anchor="middle" font-size="11" font-weight="bold" fill="#6FCF97">Done</text>
  <text x="166" y="1028" font-size="11" fill="#6FCF97">2</text>
  <rect x="105" y="1044" width="238" height="90" rx="8" fill="#232323"/>
  <text x="119" y="1068" font-size="11" fill="#EDEDED">Review workspace</text>
  <text x="119" y="1084" font-size="11" fill="#EDEDED">za-xxx, commit docs</text>
  <rect x="119" y="1096" width="52" height="18" rx="4" fill="#5C4A2E"/>
  <text x="145" y="1109" text-anchor="middle" font-size="9.5" fill="#E0C08E">claude</text>
  <rect x="177" y="1096" width="56" height="18" rx="4" fill="#5C4A2E"/>
  <text x="205" y="1109" text-anchor="middle" font-size="9.5" fill="#E0C08E">za-xxx</text>
  <rect x="357" y="1044" width="238" height="90" rx="8" fill="#232323"/>
  <text x="371" y="1068" font-size="11" fill="#EDEDED">Add offline-shop item</text>
  <text x="371" y="1084" font-size="11" fill="#EDEDED">to the TQ checklist</text>
  <rect x="371" y="1096" width="52" height="18" rx="4" fill="#5C4A2E"/>
  <text x="397" y="1109" text-anchor="middle" font-size="9.5" fill="#E0C08E">claude</text>
  <rect x="429" y="1096" width="38" height="18" rx="4" fill="#4E3030"/>
  <text x="448" y="1109" text-anchor="middle" font-size="9.5" fill="#E09C9C">xyz</text>

  <!-- ============ GITHUB CARD ============ -->
  <rect x="700" y="688" width="455" height="200" rx="16" fill="#FFFFFF" stroke="#E5DFD6" stroke-width="1.5"/>
  <g stroke="#24292E" stroke-width="2.5" fill="none">
    <circle cx="737" cy="717" r="6"/>
    <circle cx="737" cy="753" r="6"/>
    <circle cx="765" cy="735" r="6"/>
    <path d="M737 723 v24 M759.5 738 c-10 4 -18 4 -22.5 9"/>
  </g>
  <text x="790" y="728" font-size="18" font-weight="bold" fill="#2B2B2B">GitHub — shared memory</text>
  <text x="790" y="749" font-size="12.5" fill="#7A7468">phone &amp; laptop read &amp; write the same data</text>
  <text x="725" y="795" font-size="13.5" fill="#555049">• Project repos: za-xxx, za-yyyy, zclaw…</text>
  <text x="725" y="824" font-size="13.5" fill="#555049">• brain/ — journal, decisions, progress</text>
  <text x="725" y="853" font-size="13.5" fill="#555049">• Every finished job = 1 signed commit</text>

  <!-- ============ EXAMPLE LOOP ============ -->
  <rect x="700" y="918" width="455" height="252" rx="16" fill="#FFFFFF" stroke="#E5DFD6" stroke-width="1.5"/>
  <text x="725" y="953" font-size="17" font-weight="bold" fill="#2B2B2B">A typical work cycle</text>
  <g font-size="13" fill="#555049">
    <circle cx="737" cy="984" r="11" fill="#E8654F"/>
    <text x="737" y="988.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="758" y="989">Me: “explore the CS chatbot architecture”</text>
    <circle cx="737" cy="1022" r="11" fill="#E8654F"/>
    <text x="737" y="1026.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="758" y="1027">OpenClaw hands the job to Claude</text>
    <circle cx="737" cy="1060" r="11" fill="#E8654F"/>
    <text x="737" y="1064.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="758" y="1065">Claude logs a Notion task → codes → pushes</text>
    <circle cx="737" cy="1098" r="11" fill="#E8654F"/>
    <text x="737" y="1102.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="758" y="1103">Evening, on my laptop: Claude Desktop reads</text>
    <text x="758" y="1121">the brain and continues — no questions asked</text>
    <circle cx="737" cy="1152" r="11" fill="#E8654F"/>
    <text x="737" y="1156.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="758" y="1157">9am next day: reminds me what’s due</text>
  </g>

  <!-- ============ FOOTER ============ -->
  <text x="600" y="1232" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2B2B2B">Phone or laptop — the same experience, because all context lives in the brain.</text>
  <text x="600" y="1258" text-anchor="middle" font-size="13.5" fill="#7A7468">One message → work gets routed, done, logged — and synced to every device via GitHub.</text>
  <g>
    <line x1="378" y1="1292" x2="420" y2="1292" stroke="#A39B8B" stroke-width="2" marker-end="url(#ar)"/>
    <text x="428" y="1297" font-size="12.5" fill="#7A7468">chat / work routing</text>
    <line x1="618" y1="1292" x2="660" y2="1292" stroke="#A39B8B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
    <text x="668" y="1297" font-size="12.5" fill="#7A7468">logging · sync · extensibility</text>
  </g>
</svg>
