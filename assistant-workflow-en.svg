<svg width="1200" height="1330" viewBox="0 0 1200 1330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <rect width="1200" height="1330" fill="#FAF7F2"/>

  <!-- ============ TITLE ============ -->
  <text x="600" y="62" text-anchor="middle" font-size="30" font-weight="bold" fill="#2B2B2B">My Personal AI Assistant — How It Works</text>
  <text x="600" y="94" text-anchor="middle" font-size="15" fill="#7A7468">OpenClaw + Claude + Codex + Notion · self-hosted on my own server</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A39B8B"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8654F"/>
    </marker>
  </defs>

  <!-- ============ PHONE ============ -->
  <rect x="260" y="128" width="300" height="88" rx="16" fill="#FFFFFF" stroke="#E5DFD6" stroke-width="1.5"/>
  <text x="410" y="165" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B2B2B">Me — on my phone</text>
  <text x="410" y="192" text-anchor="middle" font-size="13" fill="#7A7468">Telegram · Zalo — text or voice</text>

  <!-- ============ LAPTOP ============ -->
  <rect x="640" y="128" width="300" height="88" rx="16" fill="#FFFFFF" stroke="#E5DFD6" stroke-width="1.5"/>
  <text x="790" y="165" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B2B2B">Me — on my laptop</text>
  <text x="790" y="192" text-anchor="middle" font-size="13" fill="#7A7468">Claude Desktop · Cowork</text>

  <!-- trải nghiệm như nhau -->
  <text x="600" y="150" text-anchor="middle" font-size="11" fill="#7A7468">same</text>
  <line x1="566" y1="170" x2="634" y2="170" stroke="#A39B8B" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="600" y="196" text-anchor="middle" font-size="11" fill="#7A7468">experience</text>

  <!-- two-way chat -->
  <line x1="435" y1="216" x2="510" y2="298" stroke="#A39B8B" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="440" y="265" text-anchor="end" font-size="13" fill="#7A7468">two-way chat</text>

  <!-- nhắc 9h sáng (vòng trái) -->
  <path d="M 380 345 C 245 330, 235 252, 322 220" fill="none" stroke="#E8654F" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arRed)"/>
  <text x="58" y="262" font-size="13" font-weight="bold" fill="#C24A36">9am every day:</text>
  <text x="58" y="281" font-size="13" fill="#C24A36">reads Notion, reminds me what’s due</text>

  <!-- laptop → GitHub (sync, vòng phải) -->
  <path d="M 900 216 C 1155 255, 1198 430, 1160 706" fill="none" stroke="#A39B8B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="975" y="300" font-size="13" font-weight="bold" fill="#555049">one shared memory:</text>
  <text x="975" y="319" font-size="13" fill="#7A7468">pull / push brain + repos</text>

  <!-- ============ OPENCLAW ============ -->
  <rect x="380" y="300" width="440" height="100" rx="16" fill="#FFFFFF" stroke="#E8654F" stroke-width="2.5"/>
  <text x="600" y="340" text-anchor="middle" font-size="19" font-weight="bold" fill="#C24A36">OpenClaw — the switchboard</text>
  <text x="600" y="366" text-anchor="middle" font-size="13.5" fill="#7A7468">receives messages, routes work to the right assistant</text>
  <text x="600" y="386" text-anchor="middle" font-size="13.5" fill="#7A7468">with a built-in scheduler (cron)</text>

  <!-- fan arrows -->
  <line x1="470" y1="400" x2="185" y2="488" stroke="#A39B8B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="565" y1="400" x2="455" y2="488" stroke="#A39B8B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="660" y1="400" x2="730" y2="488" stroke="#A39B8B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="760" y1="400" x2="995" y2="488" stroke="#A39B8B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="545" y="432" font-size="13" fill="#7A7468">routes work (ACP)</text>

  <!-- ============ 4 DESKS ============ -->
  <g>
    <rect x="40" y="490" width="265" height="110" rx="14" fill="#FFFFFF" stroke="#E5DFD6" stroke-width="1.5"/>
    <rect x="40" y="490" width="265" height="8" rx="4" fill="#4A90D9"/>
    <text x="172" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B2B2B">Everyday helper</text>
    <text x="172" y="554" text-anchor="middle" font-size="12.5" fill="#7A7468">zalo-desk · DeepSeek</text>
    <text x="172" y="576" text-anchor="middle" font-size="12.5" fill="#7A7468">quick Q&amp;A, small chores</text>
  </g>
  <g>
    <rect x="325" y="490" width="265" height="110" rx="14" fill="#FFFFFF" stroke="#E5DFD6" stroke-width="1.5"/>
    <rect x="325" y="490" width="265" height="8" rx="4" fill="#D97757"/>
    <text x="457" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B2B2B">Claude — lead dev</text>
    <text x="457" y="554" text-anchor="middle" font-size="12.5" fill="#7A7468">claude-desk · Claude Code</text>
    <text x="457" y="576" text-anchor="middle" font-size="12.5" fill="#7A7468">code, explore, write docs</text>
  </g>
  <g>
    <rect x="610" y="490" width="265" height="110" rx="14" fill="#FFFFFF" stroke="#E5DFD6" stroke-width="1.5"/>
    <rect x="610" y="490" width="265" height="8" rx="4" fill="#10A37F"/>
    <text x="742" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B2B2B">Codex — parallel dev</text>
    <text x="742" y="554" text-anchor="middle" font-size="12.5" fill="#7A7468">codex-desk · Codex</text>
    <text x="742" y="576" text-anchor="middle" font-size="12.5" fill="#7A7468">runs other tasks at once</text>
  </g>
  <g>
    <rect x="895" y="490" width="250" height="110" rx="14" fill="none" stroke="#A39B8B" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="1020" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#7A7468">+ New assistant</text>
    <text x="1020" y="554" text-anchor="middle" font-size="12.5" fill="#7A7468">Copilot · Antigravity · …</text>
    <text x="1020" y="576" text-anchor="middle" font-size="12.5" fill="#7A7468">plug in via ACP, ready to go</text>
  </g>

